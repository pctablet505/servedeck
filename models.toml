# servedeck v2 model registry — the single source of truth (REDESIGN-2026-09-12.md §2.1).
#
# Every model this box can serve is one [models.<key>] table. Everything a client, a
# launcher or the gateway needs (public name, aliases, port, context, reasoning/tool
# parsers, launch flags/env) is derived from here — see servedeck/models.py.
#
# `flags` and `env` are transcribed from the LIVE legacy launchers on 2026-09-12
# (file:line citations below); they do NOT include:
#   * `--served-model-name`, `--host`, `--max-model-len`, `--gpu-memory-utilization`,
#     `--port` — servedeck/models.py:render_argv computes these.
#   * CUDA_HOME / PATH venv wiring, the FlashInfer lib64 symlink shim, the HF_TOKEN
#     extraction from ~/.bashrc, or the ptrace_scope sudo relax — those are launcher
#     *mechanics*, not model properties, and are out of scope for this registry (see
#     the P1 report's "cannot express" list).
#   * (GLM's --kv-cache-memory-bytes is now pinned in [models.glm53] together with ctx;
#     serve-opt.sh:315 derived it as MAX_LEN * 17200 at launch time.)

[gpu]
total_mib  = 97887
margin_mib = 1024          # never handed to any model

# Every launcher exports this because the box has no CUDA toolkit (no nvcc), so
# FlashInfer's JIT top-k/top-p sampler cannot compile.
#   ~/Projects/local_llm/bin/qwen-server-run.sh:263
#   ~/Projects/vllm-qwen38next/serve.sh:73
#   ~/Projects/vllm-glm53/serve-opt.sh:178
#   ~/.config/systemd/user/lfm2-350m.service (Environment=)
[defaults.env]
VLLM_USE_FLASHINFER_SAMPLER = "0"
# Every model is served from the local hub cache. The Flash-Next launcher
# exported this (serve-abliterated.sh:34) and the registry did not carry it:
# the first v2 launch (2026-09-17) went online, asked the hub about a gated
# repo, and died on a 401. Offline also means a boot never depends on the
# network being up.
HF_HUB_OFFLINE = "1"

# Every legacy launcher also exports CUDA_HOME=<venv>/lib/python3.13/site-packages/
# nvidia/cu13 and prepends <venv>/bin:$CUDA_HOME/bin to PATH — nvcc/ptxas live
# there and FlashInfer's JIT needs them (qwen-server-run.sh:267-268, serve.sh:63,72,
# serve-opt.sh:168,177). Both paths below were verified to exist on this box,
# read-only, on 2026-09-12 (`ls -d <venv>/lib/python3.13/site-packages/nvidia/cu13`).
[builds.stock]
venv      = "~/Projects/local_llm/.venv-llm-029"
cuda_home = "~/Projects/local_llm/.venv-llm-029/lib/python3.13/site-packages/nvidia/cu13"

[builds.qwen38next]
venv      = "~/Projects/vllm-qwen38next/.venv-next"
cuda_home = "~/Projects/vllm-qwen38next/.venv-next/lib/python3.13/site-packages/nvidia/cu13"

[builds.glm53]
venv      = "~/Projects/vllm-glm53/.venv-glm53"
cuda_home = "~/Projects/vllm-glm53/.venv-glm53/lib/python3.13/site-packages/nvidia/cu13"

# --------------------------------------------------------------------------------
# Qwen3.8-27B-NVFP4 ("inline") — ~/Projects/local_llm/bin/qwen-server-run.sh
# --------------------------------------------------------------------------------
[models.qwen27b]
id      = "Qwen3.8-27B-NVFP4"
aliases = ["RadixArk/Qwen3.8-27B-NVFP4", "qwen27b", "inline"]
repo    = "RadixArk/Qwen3.8-27B-NVFP4"
slot    = "main"
port    = 8004
build   = "stock"
ctx     = "native"                 # config.json max_position_embeddings = 262144
vision  = true
max_output_tokens = 36000

# qwen-server-run.sh:299-307. --max-num-seqs 16 matches the LIVE .config override
# (default in the script is 128; .config currently sets MAX_NUM_SEQS="16").
flags = [
    "--speculative-config", '{"method": "mtp", "num_speculative_tokens": 4}',
    "--max-num-seqs", "16",
    "--enable-prefix-caching",
    "--mamba-cache-mode", "all",
]

[models.qwen27b.reasoning]
parser = "qwen3"
mirror_content = true

[models.qwen27b.tools]
parser = "qwen3_xml"

# --------------------------------------------------------------------------------
# Qwen3.8-Flash-Next-Uncensored-NVFP4 — ~/Projects/vllm-qwen38next/serve.sh
# --------------------------------------------------------------------------------
[models.flashnext]
id      = "Qwen3.8-Flash-Next-Uncensored-NVFP4"
aliases = ["qwen38-flash-next", "flashnext"]
repo    = "mazinb/Qwen3.8-Flash-Next-Uncensored-NVFP4"
slot    = "main"
port    = 8001
build   = "qwen38next"
ctx     = "native"                 # config.json max_position_embeddings = 262144
vision  = true
max_output_tokens = 32000
# serve.sh relaxes kernel.yama.ptrace_scope via sudo for the PLE-offload CUDA IPC
# handoff (serve.sh:106-131). No sudo in servedeck v2 today, so this model needs a
# human at a TTY until that is replaced (tracked, not solved, by this packet).
needs_tty = true

# serve.sh:218-236 (MM_LIMIT_JSON images-on, KV_DTYPE=auto, SPEC_TOKENS=3), plus
# the live v1 launch of 2026-09-17: MAX_NUM_SEQS=16 for parallel agents and the
# EXTRA_ARGS of local_llm/.config:85. `--kv-offloading-size 40` parks evicted
# contexts in 40 GiB of pinned host RAM (measured: a 35k-token context comes
# back in 0.36 s vs 3.78 s of prefill; decode unchanged). It needs the fork
# patch builds/patches/qwen38next/flashnext-kv-offload-skip-qsa-ring.patch,
# without which the engine asserts on the QSA ring group. `--prefix-match-unit`
# was dropped (measured inert, and 208 does not divide the ring's 8-token block).
flags = [
    "--tensor-parallel-size", "1",
    "--distributed-executor-backend", "mp",
    "--max-num-seqs", "16",
    "--max-num-batched-tokens", "8192",
    "--limit-mm-per-prompt", '{"image":2,"video":0}',
    "--kv-cache-dtype", "auto",
    "--enable-prefix-caching",
    "--speculative-config", '{"method":"mtp","num_speculative_tokens":3}',
    "--mamba-ssm-cache-dtype", "bfloat16",
    "--long-prefill-token-threshold", "1024",
    "--watermark", "0.10",
    "--kv-offloading-size", "40",
]

[models.flashnext.reasoning]
parser = "qwen3"
mirror_content = true

[models.flashnext.tools]
parser = "qwen3_coder"

# serve.sh:76,90-91.
[models.flashnext.env]
VLLM_PLE_CPU_OFFLOAD = "1"
# This checkpoint's PLE n-gram table is the FP8 build (model-plefp8-*.safetensors
# in the hub cache, confirmed 2026-09-12) — serve.sh:83-89 selects this env var
# from that same check.
VLLM_PLE_FP8_CHECKPOINT = "1"
PYTORCH_ALLOC_CONF = "expandable_segments:True"
TORCH_CUDA_ARCH_LIST = "12.0f"

# --------------------------------------------------------------------------------
# GLM-5.3-Flash (ABLITERATED, NVFP4) — ~/Projects/vllm-glm53/serve-opt.sh
# --------------------------------------------------------------------------------
[models.glm53]
id      = "glm53-flash"
aliases = ["glm53", "GLM-5.3-Flash"]
repo    = "dealignai/GLM-5.3-Flash-ABLITERATED-NVFP4"
slot    = "main"
port    = 8002
build   = "glm53"
# NOT native here, on purpose. config.json says 1,048,576, but GLM's context on this
# card is bounded by VRAM headroom, not by the model: 327,680 is the validated ceiling
# (held at 233k tokens only after cutting MoE hot slots; see the 2026-09 GLM notes),
# and --kv-cache-memory-bytes below is sized for exactly that length. Raise both together.
ctx     = 327680
vision  = false
max_output_tokens = 32768
# The GLM thinking-budget floor (glm53-effort-proxy today): a small max_tokens
# truncates mid-<think> and both content and reasoning_content come back empty.
min_output_tokens = 8192

# --- GLM-5.3 client-compatibility switches (P9, servedeck/glm_policies.py) ---
# ON. GLM's streaming tool-call parser can miss a closing tag that straddles a
# token boundary and the tag then leaks into the parsed argument. Captured from
# a real VS Code Copilot turn:
#     list_dir({"path</arg_key>": "/Users/user/Desktop/project"})
# The client rejects the call ("must have required property 'path'"), the agent
# loses its step and starts inventing paths. Stripping markup that is never
# valid argument text is a repair, not a guess, so it is on by default -- and
# it is also what switches on the answerless-turn COUNT for this route.
sanitize_tool_tags = true

# OFF, and it must stay off until somebody turns it on with evidence.
# What it does: Copilot echoes tool_call ids back verbatim but drops the
# reasoning, so GLM's template renders the in-flight assistant turn as an empty
# <think></think> and the model reads the thread as fresh. Restoring the
# reasoning by tool_call id fixes that, and the gateway's output-side mirror
# cannot -- the mirror makes the thinking available to a client, it cannot make
# a client send it back.
# Why off: glm53-effort-proxy/proxy.py's own comment on the switch reads
# "three Xid 31 GPU faults followed within 40 minutes of it first firing,
# after 14 hours clean". That is correlation, not proof; but this box has an
# active and unrelated GPU-fault problem (Xid 79/154 on 2026-09-12), so nothing
# that plausibly perturbs the GPU gets to default to on. Turn it on for one
# session, watch state/telemetry, and decide.
restore_reasoning = false

# OFF. Consent only: with SERVEDECK_GLM_CAPTURE=1 in the environment as well,
# the gateway keeps the last 6 turns of this route's request/response bodies
# under state/captures/<model>/ (mode 0700, credential headers redacted) for
# debugging a live failure. Bodies contain everything the user typed, which is
# why one flag lives here and the other cannot: the predecessor defaulted this
# to ON, writing full bodies to /tmp/glm-capture with no retention policy.
capture = false

# serve-opt.sh:324-352, at the script's own defaults (MAX_SEQS=1, MAX_BATCHED=8192,
# MOE_BACKEND=marlin, LOAD_FORMAT=auto, KV_DTYPE=auto, SPEC=1/SPEC_TOKENS=2, images
# off, AUTOTUNE=1 i.e. no flag, ENFORCE_EAGER=0 i.e. no flag, BLOCK_SIZE unset i.e.
# no flag, ATTN_BACKEND unset i.e. no flag).
# --kv-cache-memory-bytes = ctx * 17200 (serve-opt.sh:315-316), computed here for
# ctx = 327680 because ctx is pinned above; it must change with ctx.
flags = [
    "--kv-cache-memory-bytes", "5636096000",
    "--tensor-parallel-size", "1",
    "--distributed-executor-backend", "mp",
    "--offload-backend", "uva",
    "--cpu-offload-gb", "125",
    "--cpu-offload-params", "experts",
    "--max-num-seqs", "1",
    "--max-num-batched-tokens", "8192",
    "--limit-mm-per-prompt", '{"image":0,"video":0}',
    "--kernel-config", '{"moe_backend":"marlin"}',
    "--load-format", "auto",
    "--kv-cache-dtype", "auto",
    "--enable-prefix-caching",
    "--speculative-config", '{"method":"mtp","num_speculative_tokens":2}',
]

[models.glm53.reasoning]
parser = "glm47"
mirror_content = true

[models.glm53.tools]
parser = "glm47"

[models.glm53.presets]
glm53-flash-low  = { reasoning_effort = "low" }
glm53-flash-high = { reasoning_effort = "high" }
glm53-flash-max  = {}

# serve-opt.sh:78-202, "the measured-best configuration".
[models.glm53.env]
CPU_OFFLOAD_GB = "125"
VLLM_MOE_HOT_SLOTS = "54"
VLLM_USE_BREAKABLE_CUDAGRAPH = "0"
VLLM_MOE_PREFILL_GROUPS = "1"
VLLM_MOE_HOT_PROFILE = "/home/pctablet505/Projects/vllm-glm53/hot-profile-125.json"
VLLM_WEIGHT_OFFLOADING_DISABLE_PIN_MEMORY = "1"
VLLM_USE_DEEP_GEMM = "0"
PYTORCH_ALLOC_CONF = "expandable_segments:True,pinned_use_cuda_host_register:True,pinned_num_register_threads:8"
TORCH_CUDA_ARCH_LIST = "12.0f"

# --------------------------------------------------------------------------------
# LFM2.5-350M — opt-in resident for mechanical, no-intelligence work (and the
# e2e gate). Owner directive 2026-09-16: by default servedeck runs one model;
# this resident is NOT started by default and nothing auto-adds it to
# desired.json — an operator turns it on explicitly (`servedeck start lfm2` /
# the "More models" card) when it is actually needed.
# --------------------------------------------------------------------------------
[models.lfm2]
id       = "LFM2.5-350M"
repo     = "LiquidAI/LFM2.5-350M"
slot     = "resident"
vram_mib = 3300
port     = 8007
build    = "stock"
ctx      = 32768                   # not native (128,000): lfm2-350m.service sizes this
                                    # resident's whole VRAM budget (vram_mib above) around
                                    # a 32768 KV cache, not the checkpoint's native ceiling
vision   = false
max_output_tokens = 4096
# No reasoning: LFM2.5 has no thinking mode, so there is no `reasoning` field to
# mirror into `reasoning_content` (lfm2-350m.service header comment).

# lfm2-350m.service ExecStart. NOTE: the live unit actually runs from
# vllm-qwen38next/.venv-next's python -m vllm.entrypoints.openai.api_server, not
# `<build>/bin/vllm serve` — build="stock" here is this packet's consolidation
# decision, not a transcription of the live unit. See the P1 report.
flags = [
    "--max-num-seqs", "64",
    "--dtype", "bfloat16",
]

[models.lfm2.tools]
parser = "lfm2"
