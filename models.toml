# --- Nemotron-3.5-Super-VL-120B-A12B, abliterated NVFP4 build by armin1, wired 2026-10-24 in place of ThinkingCap
# (whose weights were deleted the same day, so its two entries above fail doctor's weights row). Revision
# 1e1c8ecf1976ee0ec387c114c1964a6f3506e804, 75.06 GB in 88 shards, licence OpenMDW 1.1 (the base model's).
# UNCENSORED: the card claims keyword refusals fall from 98% to 2% (the publisher's own harness, not re-measured
# here). Not for automated pipelines.
# Architecture NemotronH_Omni_Reasoning_V3 (model_type nemotron_h_omni): 88 layers = 40 Mamba-2, 40 latent-MoE
# (512 routed experts, 22 per token, 1 shared), 8 attention (2 KV heads of 128), a C-RADIO vision tower and one MTP
# layer; 1,048,576-token native context. ModelOpt MIXED_PRECISION NVFP4/FP8 with FP8 KV-cache scheme. vLLM 0.29.0 and
# 0.32.0 register the architecture; the qwen38next fork does not, so build = stock032.
# --trust-remote-code is needed for the HF config class only (vLLM brings its own model code); the repo's .py files
# were read before the first boot: no os/subprocess/network/exec calls.
# Flags: the card's vLLM recipe (reasoning parser nemotron_v3, tool parser qwen3_coder, 8,192 batched tokens) plus
# the checkpoint's own MTP head at 5 draft tokens, from a 2026-10-25 sweep of 36 variants on real agent prompts: one
# request 110 -> 312 tok/s, 16 in flight 670 -> 1,232 tok/s (3 draft tokens: 249 and 1,266-1,396; more than 5 gains
# nothing). util 0.90, 16 sequences and host_ram_gib are not tuned. Sweep, failures and gaps: docs/models/nemotron.md.
[models.nemotron-abl]
