# servedeck model registry — the single source of truth.
# Reference for every key: docs/CONFIGURATION.md. Why it exists: docs/DECISIONS.md.
#
# The file:line citations below name the legacy launchers each flag and env var
# was transcribed from. Those scripts still sit in their own trees, none of
# which is a git repository, so a verbatim copy of each is committed under
# docs/imported-2026-09/ — when local_llm is archived, that copy is the
# referent.
#
# Every model this box can serve is one [models.<key>] table. Everything a client, a
# launcher or the gateway needs (public name, aliases, port, context, reasoning/tool
# parsers, launch flags/env) is derived from here — see servedeck/models.py.
#
# `flags` and `env` are transcribed from the LIVE legacy launchers on 2026-09-12
# (file:line citations below); they do NOT include:
#   * `--served-model-name`, `--host`, `--max-model-len`, `--gpu-memory-utilization`,
#     `--port` — servedeck/models.py:render_argv computes these.
#   * CUDA_HOME / PATH venv wiring, the FlashInfer lib64 symlink shim, the HF_TOKEN
#     extraction from ~/.bashrc, or the ptrace_scope sudo relax — those are launcher
#     *mechanics*, not model properties, and are out of scope for this registry (see
#     the P1 report's "cannot express" list).
#   * (GLM's --kv-cache-memory-bytes is now pinned in [models.glm53] together with ctx;
#     serve-opt.sh:315 derived it as MAX_LEN * 17200 at launch time.)

[gpu]
total_mib  = 97887
margin_mib = 1024          # never handed to any model

# Every launcher exports this because the box has no CUDA toolkit (no nvcc), so
# FlashInfer's JIT top-k/top-p sampler cannot compile.
#   ~/Projects/local_llm/bin/qwen-server-run.sh:263
#   ~/Projects/vllm-qwen38next/serve.sh:73
#   ~/Projects/vllm-glm53/serve-opt.sh:178
#   ~/.config/systemd/user/lfm2-350m.service (Environment=)
[defaults.env]
VLLM_USE_FLASHINFER_SAMPLER = "0"
# Every model launches from the local hub cache, never the network.
#
# History, because this flag has moved twice: serve-abliterated.sh:34 and
# local_llm/profiles/flashnext.env set it for Flash-Next only; the registry did
# not carry it, so the first v2 launch asked the hub about a gated repo and
# died on a 401. It was then set for all four models, which was unverified, and
# narrowed back to flashnext on review. It is here now because the 2026-09-18
# audit verified all four snapshots are complete on disk AND `servedeck doctor`
# grew a `weights (<key>)` row per model, so a missing checkpoint is reported
# before a launch instead of discovered as a 401 minutes into one.
#
# What this buys: a launch cannot depend on the network, cannot resolve a
# revision other than the one on disk, and needs no HF_TOKEN. What it costs:
# if a snapshot is genuinely missing a file vLLM wants, the launch fails fast
# with a local-files-only error instead of fetching it. The 27B and GLM have
# not yet been launched under v2, so watch the first one.
HF_HUB_OFFLINE = "1"

# Every legacy launcher also exports CUDA_HOME=<venv>/lib/python3.13/site-packages/
# nvidia/cu13 and prepends <venv>/bin:$CUDA_HOME/bin to PATH — nvcc/ptxas live
# there and FlashInfer's JIT needs them (qwen-server-run.sh:267-268, serve.sh:63,72,
# serve-opt.sh:168,177). Both paths below were verified to exist on this box,
# read-only, on 2026-09-12 (`ls -d <venv>/lib/python3.13/site-packages/nvidia/cu13`).
[builds.stock]
venv      = "~/Projects/local_llm/.venv-llm-029"
cuda_home = "~/Projects/local_llm/.venv-llm-029/lib/python3.13/site-packages/nvidia/cu13"

# vLLM 0.32.0 (2026-10-22, for ornith): plain PyPI wheel plus FlashInfer's prebuilt
# kernels for this card (flashinfer-jit-cache and -sm120f, --no-deps) and the same two
# symlinks as stock (docs/BUILDS.md). stock stays on 0.29.0 for the models it serves.
[builds.stock032]
venv      = "~/Projects/local_llm/.venv-llm-032"
cuda_home = "~/Projects/local_llm/.venv-llm-032/lib/python3.13/site-packages/nvidia/cu13"

[builds.qwen38next]
venv      = "~/Projects/vllm-qwen38next/.venv-next"
cuda_home = "~/Projects/vllm-qwen38next/.venv-next/lib/python3.13/site-packages/nvidia/cu13"

[builds.glm53]
venv      = "~/Projects/vllm-glm53/.venv-glm53"
cuda_home = "~/Projects/vllm-glm53/.venv-glm53/lib/python3.13/site-packages/nvidia/cu13"

# --------------------------------------------------------------------------------
# Qwen3.8-27B-NVFP4 ("inline") — ~/Projects/local_llm/bin/qwen-server-run.sh
# --------------------------------------------------------------------------------
[models.qwen27b]
id      = "Qwen3.8-27B-NVFP4"
# Proven utilisation, NOT a computed one. local_llm/.config's own commented
# entries for this model read GPU_MEM_UTIL="0.95", which is also
# qwen-server-run.sh's live value and the one memory note
# qwen27b-xid-root-cause.md records the owner choosing deliberately.
# 2026-09-27 (owner): the GPU is shared by design (LLM + training + eval concurrently, each on a memory
# budget). 0.40 leaves ~53 GiB for training beside lfm2 (0.05), keeps the native 262k context, and sits in
# the proven-safe zone (Xid 13+31 were seen at 0.62/0.92; zero since Aug 24 at 0.47). Was 0.95.
util    = 0.40
aliases = ["RadixArk/Qwen3.8-27B-NVFP4", "qwen27b", "inline"]
repo    = "RadixArk/Qwen3.8-27B-NVFP4"
slot    = "main"
port    = 8004
build   = "stock"
ctx     = "native"                 # config.json max_position_embeddings = 262144
vision  = true
max_output_tokens = 36000

# qwen-server-run.sh:299-307. --max-num-seqs 16 matches the LIVE .config override
# (default in the script is 128; .config currently sets MAX_NUM_SEQS="16").
flags = [
    "--speculative-config", '{"method": "mtp", "num_speculative_tokens": 4}',
    "--max-num-seqs", "16",
    "--enable-prefix-caching",
    "--mamba-cache-mode", "all",
]

[models.qwen27b.reasoning]
parser = "qwen3"
mirror_content = true

[models.qwen27b.tools]
parser = "qwen3_xml"

# --------------------------------------------------------------------------------
# Qwen3.8-Flash-Next-Uncensored-NVFP4 — ~/Projects/vllm-qwen38next/serve.sh
# --------------------------------------------------------------------------------
[models.flashnext]
id      = "Qwen3.8-Flash-Next-Uncensored-NVFP4"
# serve.sh:197 sizes this model's whole KV budget at 0.96 ("262,144 tokens at
# GPU_MEM_UTIL 0.96, which still holds a full 262,144-token request"), and
# local_llm/.config:92 ran it at 0.965. 0.96 is what the live engine runs and
# the highest value this model has served at without a CUDA OOM under
# concurrency; 0.98 (what free-VRAM arithmetic yields on an idle card) boots
# and then dies with agents in flight — measured 2026-09-03.
util    = 0.96
# 48 GiB of FP8 PLE table (VLLM_PLE_CPU_OFFLOAD=1, host-side and pinned) plus
# the 40 GiB KV-offload buffer in /dev/shm, plus slack for the loader's
# transient copies; measured resident host use for this model is ~114 GiB
# (2026-09-17). There is no swap on this box, so a shortfall is an OOM kill of
# the desktop, not a slowdown.
host_ram_gib = 95
aliases = ["qwen38-flash-next", "flashnext"]
repo    = "mazinb/Qwen3.8-Flash-Next-Uncensored-NVFP4"
slot    = "main"
port    = 8001
build   = "qwen38next"
ctx     = "native"                 # config.json max_position_embeddings = 262144
vision  = true
max_output_tokens = 32000
# needs_tty is GONE (2026-09-18). serve.sh relaxed kernel.yama.ptrace_scope via
# sudo for the PLE-offload CUDA IPC handoff (serve.sh:106-131) and nothing in
# servedeck could; /etc/sysctl.d/90-servedeck.conf now pins it to 0 at boot, so
# this model launches unattended — it did tonight. Nothing ever enforced the
# flag anyway (it only chose whether doctor printed a row); doctor now checks
# the sysctl unconditionally, as the host property it is.

# serve.sh:218-236 (MM_LIMIT_JSON images-on, KV_DTYPE=auto, SPEC_TOKENS=3), plus
# the live v1 launch of 2026-09-17: MAX_NUM_SEQS=16 for parallel agents and the
# EXTRA_ARGS of local_llm/.config:85. `--kv-offloading-size 40` parks evicted
# contexts in 40 GiB of pinned host RAM (measured: a 35k-token context comes
# back in 0.36 s vs 3.78 s of prefill; decode unchanged). It needs the fork
# patch builds/patches/flashnext-kv-offload-skip-qsa-ring.patch,
# without which the engine asserts on the QSA ring group. `--prefix-match-unit`
# was dropped (measured inert, and 208 does not divide the ring's 8-token block).
flags = [
    "--tensor-parallel-size", "1",
    "--distributed-executor-backend", "mp",
    "--max-num-seqs", "16",
    "--max-num-batched-tokens", "8192",
    # 2026-10-16: OpenWork's browser work sends a screenshot per step and the whole history
    # is resent each turn, so 4 failed on the 5th ("At most 4 image(s) may be provided in one
    # prompt", HTTP 400). 256 is about what the 262,144-token window holds at ~1,000 tokens per
    # 1280x800 shot (measured: 1 shot = 1,068 prompt tokens, 4 shots = 4,074), so once the reply has
    # its room the window binds first. The cap costs no VRAM: the encoder is profiled with one item
    # whatever this says (boot log, 2026-10-16).
    "--limit-mm-per-prompt", '{"image":256,"video":0}',
    "--kv-cache-dtype", "auto",
    "--enable-prefix-caching",
    "--speculative-config", '{"method":"mtp","num_speculative_tokens":3}',
    "--mamba-ssm-cache-dtype", "bfloat16",
    "--long-prefill-token-threshold", "1024",
    "--watermark", "0.10",
    "--kv-offloading-size", "40",
    # Without this, vLLM's shutdown timeout is 0, which means "abort": the API
    # server SIGTERMs the engine and force-kills it immediately (fork:
    # vllm/v1/utils.py shutdown(), deadline = now + timeout). The engine never
    # reaches CPUOffloadingWorker.shutdown(), so cudaHostUnregister and the
    # unlink of /dev/shm/vllm_offload_*.mmap never run and 40 GiB of host RAM
    # is orphaned on EVERY restart, not just on a crash. 30 s also drains
    # in-flight requests instead of dropping an agent's generation mid-stream.
    "--shutdown-timeout", "30",
]

[models.flashnext.reasoning]
parser = "qwen3"
mirror_content = true

[models.flashnext.tools]
parser = "qwen3_coder"

# serve.sh:76,90-91.
[models.flashnext.env]
VLLM_PLE_CPU_OFFLOAD = "1"
# This checkpoint's PLE n-gram table is the FP8 build (model-plefp8-*.safetensors
# in the hub cache, confirmed 2026-09-12) — serve.sh:83-89 selects this env var
# from that same check.
VLLM_PLE_FP8_CHECKPOINT = "1"
PYTORCH_ALLOC_CONF = "expandable_segments:True"
TORCH_CUDA_ARCH_LIST = "12.0f"
# To watch the KV-offload scheduler again, add back:
#   VLLM_LOGGING_CONFIG_PATH = "<repo>/config/flashnext-kvoffload-debug.logging.json"
# That file raises v1/core/sched/scheduler.py and the offloading scheduler to
# DEBUG and leaves every other logger at INFO; plain VLLM_LOGGING_LEVEL=DEBUG
# floods the journal instead (measured ~600 lines/min at DEBUG on those two
# alone). It is off by default because it is a diagnostic, not a setting: the
# stall it was added for on 2026-09-30 is fixed by
# builds/patches/flashnext-sched-hol-deadlock-on-external-kv-hit.patch. Note
# VLLM_LOGGING_CONFIG_PATH REPLACES vLLM's default logging config wholesale
# (vllm/logger.py:179-201), which is why that file restates formatter/handler.

# >>> batch profile flashnext-batch
# --------------------------------------------------------------------------------
# Flash-Next, batch profile (2026-10-10). The same checkpoint, build and env as [models.flashnext].
# Flags differ in three places:
#   * no `--kv-offloading-size`. That 40 GiB pinned buffer parks evicted agent contexts so a
#     returning agent skips its prefill; a batch of single-shot requests (one page per request,
#     nothing returns) never reads it back.
#     Owner 2026-10-10: "we were offloading around 40gb kv cache to RAM while using codex
#     for multiple subagents, but our usecase we might not require that much".
#   * no `--speculative-config`. Without the draft head the weights take 74.2 GiB instead of 79.3
#     and the KV cache is 532,066 tokens instead of 278,479, so 48 page requests run at once where
#     the cache is full at about 13 with it. Generated tokens a second are the same either way
#     (measured 2026-10-10 on 700 fresh page pictures, 80 s windows, card at 511 W: without it 569
#     at 32 in flight and 703 at 48; with it 676 at 16, 717 at 24, 539 at 32 with 19 waiting). With
#     it and 64 slots the first request died with a CUDA out-of-memory error.
#   * `--max-num-seqs 64` instead of 16: a ceiling; the client sends 48
#     (owner 2026-10-10: "try as many as it can handle").
# It holds 61 GiB of host RAM (measured, see host_ram_gib) instead of 91 serving / 114 loading, so a
# batch can run beside a test suite or a store build. Evidence: the nse-knowledge task folder,
# charts/PROCESS.md and charts/probe2/.
# Keep in step: any other change to [models.flashnext] flags or env belongs here too
# (tests/test_models.py fails on drift).
# --------------------------------------------------------------------------------
[models.flashnext-batch]
id      = "Qwen3.8-Flash-Next-batch"
util    = 0.96
# MemAvailable required before launch. Measured 2026-10-10 12:31-12:38 (with the draft head; boot
# 196 s, then 80 pages at 16 in flight): the unit's anon + shmem peaked at 61.3 GiB, 51.9 of it
# within 90 s of launch. Its file cache reached 68.8 GiB while the weights were read; that is
# reclaimable. Lowest MemAvailable in the three later blocks: 53.4 GiB.
host_ram_gib = 66
aliases = ["flashnext-batch"]
repo    = "mazinb/Qwen3.8-Flash-Next-Uncensored-NVFP4"
slot    = "main"
port    = 8003
build   = "qwen38next"
ctx     = "native"
vision  = true
max_output_tokens = 32000
flags = [
    "--tensor-parallel-size", "1",
    "--distributed-executor-backend", "mp",
    "--max-num-seqs", "64",
    "--max-num-batched-tokens", "8192",
    "--limit-mm-per-prompt", '{"image":256,"video":0}',
    "--kv-cache-dtype", "auto",
    "--enable-prefix-caching",
    "--mamba-ssm-cache-dtype", "bfloat16",
    "--long-prefill-token-threshold", "1024",
    "--watermark", "0.10",
    "--shutdown-timeout", "30",
]

[models.flashnext-batch.reasoning]
parser = "qwen3"
mirror_content = true

[models.flashnext-batch.tools]
parser = "qwen3_coder"

[models.flashnext-batch.env]
VLLM_PLE_CPU_OFFLOAD = "1"
VLLM_PLE_FP8_CHECKPOINT = "1"
PYTORCH_ALLOC_CONF = "expandable_segments:True"
TORCH_CUDA_ARCH_LIST = "12.0f"

# <<< batch profile flashnext-batch

# --------------------------------------------------------------------------------
# NVIDIA's Qwen3.8-Flash-Next-FP4-Local (QAD NVFP4, stock refusals) — added 2026-10-18.
# The checkpoint's expert scales are CSF containers that only b12x decodes, so it runs NVIDIA's
# own vLLM and FlashInfer forks on the qwen38next venv, put in front of it by PYTHONPATH; the
# venv itself is unmodified. What the overlay holds and how it was assembled: docs/BUILDS.md.
# Flags and env are the model card's RTX PRO 6000 recipe, minus eight variables that change
# nothing here (see [models.fp4local.env]). Measured 2026-10-18 at the 425 W cap with this env:
# ready in 168 s, 805,463 KV tokens at util 0.96, ~190 tok/s single-stream, 1,027 tok/s
# aggregate at 16 parallel. With the card's full env it had also answered a 159,036-token
# prompt in 12.1 s.
# B12X_AUTOTUNE=0 runs every b12x kernel on its default config and never reads tuned winners
# (lil-flashinfer b12x/preparation/session.py, _warmup_only). Tuning gains nothing measurable
# here: with the 184 GEMM and MoE plans tuned, 180/439/599/675 tok/s at 1/4/8/16 parallel
# against 197/431/584/716 untuned (2,000-token random prompts, 512 out, quiet CPU, 2026-10-18),
# and a first tuned boot spends minutes measuring (~19 s per linear-attention prefill plan).
# Also tested 2026-10-18 and kept: VLLM_B12X_MOE_FP4_FORCE_A16=1. Decode MoE is half of a decode
# step's GPU time (torch profile, 8 parallel), but the A4 kernel was no faster on a
# quiet CPU (180/377/580/698 tok/s at 1/4/8/16 vs 180/439/599/675, 2,000-token random prompts).
# Also tested 2026-10-18 and left out (sonnet prompts unless noted; run-to-run noise is ~10%):
# 2 or 4 speculative tokens; VLLM_B12X_BF16_GEMV=1 (one request 4.45 ms/token vs 3.90: its plans run
# untuned); VLLM_B12X_PAGED_DECODE=1 (Flash-Next's QSA layers do not use it); full tuning including
# the linear-attention prefill plans (222/733/884 tok/s at 1/8/16 and 23.98 ms/token at 60k context
# vs 229/725/917 and 24.0 untuned); --max-num-batched-tokens 12035 (KV 805k -> 593k tokens, and eight
# 60k-token requests finished in 49.8 s instead of 45.6). Batched decode is power-bound here: at 16
# parallel the card sits at its 425 W cap with SM clocks 2.3-2.6 of 3.09 GHz.
# No --kv-offloading-size, and not for lack of the QSA-ring skip patch: on this b12x path the
# raw-key ring is a per-slot buffer (lil-vllm b12x_qsa.py), not a KV cache group, so the
# assert that patch fixed cannot fire (the 08:15 boot had 50 groups, all 3,008-token blocks).
# The cost is elsewhere. With any KV connector this fork boots Flash-Next only under
# --recurrent-checkpoint-policy aligned (the "Qwen QSA KV transfer" ValueError in
# vllm/config/vllm.py), and that switches off request-boundary checkpoint caching, so an agent
# turn reuses its prefix only up to the last 3,008-token block instead of the previous turn's
# end. With it on, 81.5% of 162M prompt tokens were cache hits (08:15-13:50 on 2026-10-18).
# --------------------------------------------------------------------------------
[models.fp4local]
id      = "Qwen3.8-Flash-Next-FP4-Local"
util    = 0.96
# The engine unit's MemoryPeak was 79.3 GiB after six hours of serving (2026-10-18: boot, 16
# parallel requests, a 159k-token prompt); the PLE table alone is 26.8 GiB of CUDA-mapped host memory.
host_ram_gib = 85
aliases = ["nvidia/Qwen3.8-Flash-Next-FP4-Local", "fp4local"]
repo    = "nvidia/Qwen3.8-Flash-Next-FP4-Local"
slot    = "main"
port    = 8005
build   = "qwen38next"
ctx     = "native"                 # text_config.max_position_embeddings = 262144
vision  = true
max_output_tokens = 32000
flags = [
    "--tensor-parallel-size", "1",
    "--async-scheduling",
    "--block-size", "64",
    "--compilation-config", '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}',
    "--dtype", "bfloat16",
    "--enable-chunked-prefill",
    "--enable-prefix-caching",
    "--no-enable-flashinfer-autotune",
    "--gdn-decode-kernel", "b12x",
    "--linear-backend", "b12x",
    "--moe-backend", "b12x",
    "--kv-cache-dtype", "fp8",
    "--no-language-model-only",
    "--mamba-cache-mode", "align",
    "--mamba-ssm-cache-dtype", "auto",
    "--max-cudagraph-capture-size", "64",
    "--max-num-batched-tokens", "6019",
    "--max-num-seqs", "16",
    "--mm-encoder-tp-mode", "data",
    "--mm-processor-cache-gb", "0.0",
    "--limit-mm-per-prompt", '{"image":256,"video":0}',
    "--quantization", "modelopt_mixed",
    "--enable-prompt-tokens-details",
    "--speculative-config", '{"method":"mtp","draft_sample_method":"probabilistic","rejection_sample_method":"standard","moe_backend":"b12x","num_speculative_tokens":3}',
    # Drains in-flight requests on a stop instead of dropping them (see [models.flashnext]).
    "--shutdown-timeout", "30",
]

[models.fp4local.reasoning]
parser = "qwen3"
mirror_content = true

[models.fp4local.tools]
parser = "qwen3_xml"

# Absolute paths: env values reach the unit literally, and nothing expands "~" in them.
# Dropped from the card's recipe because nothing in the code this runs reads them (grep of
# lil-vllm, lil-flashinfer, extra-site and the venv's torch/safetensors/triton, 2026-10-18):
# B12X_DYNAMIC_DIRECT_EXPERT_SCALES, B12X_DYNAMIC_SKIP_SPLIT_BARRIER_RESET,
# B12X_DYNAMIC_SPLIT_{COMPUTE_MAC,FAST_PREPARE,LOW_SMEM,ROUTE_COMPUTE} and SAFETENSORS_FAST_GPU.
# Also VLLM_CAUSAL_CONV1D_UPDATE_HOIST=1: it is the default (causal_conv1d.py), and setting it
# only makes vLLM warn about an unknown variable on every boot.
# The card targets NVIDIA's newer runtime image, whose b12x reads more knobs than this one.
[models.fp4local.env]
PYTHONPATH = "/home/pctablet505/Projects/vllm-qwen38nv/lil-flashinfer:/home/pctablet505/Projects/vllm-qwen38nv/extra-site:/home/pctablet505/Projects/vllm-qwen38nv/lil-vllm"
# liburing 2.14 built into a private prefix (b12x's io_uring disk backend); no system package.
PKG_CONFIG_PATH = "/home/pctablet505/Projects/vllm-qwen38nv/prefix/lib/pkgconfig"
LD_LIBRARY_PATH = "/home/pctablet505/Projects/vllm-qwen38nv/prefix/lib"
B12X_AUTOTUNE = "0"
B12X_DENSE_SPLITK_TURBO = "1"
B12X_DYNAMIC_DETERMINISTIC_OUTPUT = "0"
B12X_DYNAMIC_WORK_SOURCE = "persistent_grid"
B12X_W4A16_A4_PREFILL = "1"
B12X_DISK_BACKEND = "io_uring"
B12X_MHC_PDL = "1"
CUDA_BINARY_LOADER_THREAD_COUNT = "8"
CUDA_DEVICE_ORDER = "PCI_BUS_ID"
CUDA_MODULE_LOADING = "LAZY"
CUTE_DSL_ARCH = "sm_120a"
OMP_NUM_THREADS = "2"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
TORCHINDUCTOR_LOOP_ORDERING_AFTER_FUSION = "0"
TORCH_CUDA_ARCH_LIST = "12.0a"
TORCH_ALLOW_TF32_CUBLAS_OVERRIDE = "1"
VLLM_B12X_DENSE_ACTIVATION_MODE = "auto"
VLLM_B12X_MOE_FP4_FORCE_A16 = "1"
VLLM_COMPUTE_NANS_IN_LOGITS = "0"
VLLM_DISABLED_KERNELS = "MarlinFP8ScaledMMLinearKernel"
VLLM_GDN_SPEC_DECODE_METADATA_FASTPATH = "1"
VLLM_LM_HEAD_A16 = "1"
VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS = "0"
VLLM_MTP_NVFP4_LM_HEAD = "1"
# The output layer quantized to MXFP8 on load (the checkpoint ships it in BF16): 3.90 ms per token
# for one request instead of 4.17-4.54, 227/702/961 tok/s at 1/8/16 parallel against 207/689/880
# (sonnet prompts, 2026-10-18); answers to a fixed arithmetic/fact/code/translation set unchanged.
VLLM_MXFP8_LM_HEAD = "1"
VLLM_PLE_CPU_OFFLOAD = "1"
VLLM_QWEN3_8_FLASH_NEXT_HC_TP = "0"
VLLM_QWEN3_8_FLASH_NEXT_MTP_COMPACT = "1"
VLLM_QWEN3_8_FLASH_NEXT_OVERLAP = "1"
VLLM_SSM_CONV_STATE_LAYOUT = "DS"
VLLM_USE_V2_MODEL_RUNNER = "1"
VLLM_WORKER_MULTIPROC_METHOD = "spawn"

# --------------------------------------------------------------------------------
# Ornith-1.5-122B-NVFP4 -- the main model from 2026-10-22. Owner, that day: "ornith 1.5 122b is now a
# new model more intelligent and stronger option than that of qwen flash next"; Flash-Next's weights
# were deleted the same day (its three entries above now fail doctor's weights row).
# From 2026-10-23 the weights are dealignai's uncensored NVFP4 build (owner: replace them with the
# uncensored one "that has the best numbers"): dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4 (MIT, revision
# e6a1c178), 75.7 GB in 50 shards, the same architecture and ModelOpt layout as ornith-ai's build
# (revision f049036f, 77.7 GB, deleted from the disk). Its experts, including the MTP layer's, are
# unfused; the MTP experts are FP8 block-quantized (see [models.ornith.env]). It has no KV-cache scales.
# Architecture Qwen3_5MoeForConditionalGeneration: 48 layers, every 4th full attention (12 layers,
# 2 KV heads of 256) and the other 36 Gated DeltaNet linear attention; 256 routed experts, top-8, plus
# a shared expert; one MTP layer; a vision tower; 262,144-token native context. ModelOpt
# MIXED_PRECISION: attention and linear-attention projections FP8 (W8A8); experts, shared expert and
# lm_head NVFP4 weight-only (W4A16, group 16); FP8 KV-cache scales in the checkpoint.
# The card asks for vLLM >= 0.19.1. It runs on the plain 0.32.0 wheel (build stock032); 0.29.0
# (stock) also serves it, measured equal, and is the fallback: build = "stock" works unchanged.
# Flags, each measured 2026-10-22 (docs/models/ornith.md): the card's recipe (prefix caching, qwen3
# reasoning parser, qwen3_xml tool parser); the checkpoint's MTP head at 3 draft tokens (0, 1, 2 and
# 4 were slower); 32 sequences (16 capped throughput at 32 in flight; 64 added nothing, the card is
# at its power cap); --mamba-cache-mode align, the only prefix-caching mode 0.32 has (0.29's "all"
# measured the same); FP8 KV with the checkpoint's scales; 256 images per prompt (OpenWork's browser
# screenshots, see [models.flashnext]); a 30 s drain on stop. util 0.96 with 16,384 batched tokens
# runs out of memory at boot.
# Sampling: generation_config.json (temperature 0.6, top_p 0.95, top_k 20) is vLLM's default for a
# request that names none, the card's setting for precise coding; its general-task setting is
# temperature 1.0 with presence_penalty 1.5. Measurements and tuning: docs/models/ornith.md.
# --------------------------------------------------------------------------------
[models.ornith]
id      = "Ornith-1.5-122B-NVFP4"
# util: the measured fit (KV pool 12.9 GiB = 834,094 tokens, 3.18x at 262,144). host_ram_gib: the
# engine's anonymous memory peaked at 5,570 MiB across 12 measured boots (8 GiB with slack), plus the 20 GiB
# pinned KV-offload buffer in /dev/shm (--kv-offloading-size 20); the weights' page cache is reclaimable.
util    = 0.94
host_ram_gib = 28
aliases = ["ornith-ai/Ornith-1.5-122B-NVFP4", "Ornith-1.5-122B", "ornith",
           "dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4", "Ornith-1.5-122B-UNCENSORED"]
repo    = "dealignai/Ornith-1.5-122B-UNCENSORED-NVFP4"
slot    = "main"
port    = 8006
build   = "stock032"
ctx     = "native"                 # text_config.max_position_embeddings = 262144
vision  = true
max_output_tokens = 32000
flags = [
    "--max-num-seqs", "32",
    "--max-num-batched-tokens", "8192",
    "--enable-prefix-caching",
    "--mamba-cache-mode", "align",
    "--kv-cache-dtype", "fp8",
    "--speculative-config", '{"method":"mtp","num_speculative_tokens":3}',
    "--limit-mm-per-prompt", '{"image":256,"video":0}',
    "--kv-offloading-size", "20",
    "--shutdown-timeout", "30",
]

# The uncensored checkpoint's MTP experts are FP8 block-quantized (weight_scale_inv); vLLM 0.32 sends
# those to DeepGEMM, whose JIT compile fails here (nvcc and the cu13 headers disagree, 2026-10-23
# boot log). With DeepGEMM off they take the Triton block-FP8 path.
[models.ornith.env]
VLLM_USE_DEEP_GEMM = "0"
VLLM_MOE_USE_DEEP_GEMM = "0"

[models.ornith.reasoning]
parser = "qwen3"
mirror_content = true

[models.ornith.tools]
parser = "qwen3_xml"

# --------------------------------------------------------------------------------
# GLM-5.3-Flash (ABLITERATED, NVFP4) — ~/Projects/vllm-glm53/serve-opt.sh
# --------------------------------------------------------------------------------
[models.glm53]
id      = "glm53-flash"
# serve-opt.sh:328 — GPU_UTIL defaults to 0.95 and every measured GLM run on
# this card used it. GLM's KV is capped separately by --kv-cache-memory-bytes,
# so raising this only takes VRAM the hot-expert slots need.
util    = 0.95
# serve-opt.sh:315-316 derives the KV cap as MAX_LEN * 17200 at launch time;
# servedeck emits --kv-cache-memory-bytes from this and the launch ctx.
kv_cache_bytes_per_token = 17200
# serve-opt.sh:218 — CPU_OFFLOAD_GB + 30, calibrated against a measured
# 168 GiB peak at 110 GiB of offload (the loader's transient copies cost far
# more than the pinned weights alone).
host_ram_gib = 155
aliases = ["glm53", "GLM-5.3-Flash"]
repo    = "dealignai/GLM-5.3-Flash-ABLITERATED-NVFP4"
slot    = "main"
port    = 8002
build   = "glm53"
# NOT native here, on purpose. config.json says 1,048,576, but GLM's context on this
# card is bounded by VRAM headroom, not by the model: 327,680 is the validated ceiling
# (held at 233k tokens only after cutting MoE hot slots; see the 2026-09 GLM notes),
# and --kv-cache-memory-bytes below is sized for exactly that length. Raise both together.
ctx     = 327680
vision  = false
max_output_tokens = 32768
# The GLM thinking-budget floor (glm53-effort-proxy today): a small max_tokens
# truncates mid-<think> and both content and reasoning_content come back empty.
min_output_tokens = 8192

# --- GLM-5.3 client-compatibility switches (P9, servedeck/glm_policies.py) ---
# ON. GLM's streaming tool-call parser can miss a closing tag that straddles a
# token boundary and the tag then leaks into the parsed argument. Captured from
# a real VS Code Copilot turn:
#     list_dir({"path</arg_key>": "/Users/user/Desktop/project"})
# The client rejects the call ("must have required property 'path'"), the agent
# loses its step and starts inventing paths. Stripping markup that is never
# valid argument text is a repair, not a guess, so it is on by default -- and
# it is also what switches on the answerless-turn COUNT for this route.
sanitize_tool_tags = true

# OFF, and it must stay off until somebody turns it on with evidence.
# What it does: Copilot echoes tool_call ids back verbatim but drops the
# reasoning, so GLM's template renders the in-flight assistant turn as an empty
# <think></think> and the model reads the thread as fresh. Restoring the
# reasoning by tool_call id fixes that, and the gateway's output-side mirror
# cannot -- the mirror makes the thinking available to a client, it cannot make
# a client send it back.
# Why off: glm53-effort-proxy/proxy.py's own comment on the switch reads
# "three Xid 31 GPU faults followed within 40 minutes of it first firing,
# after 14 hours clean". That is correlation, not proof; but this box has an
# active and unrelated GPU-fault problem (Xid 79/154 on 2026-09-12), so nothing
# that plausibly perturbs the GPU gets to default to on. Turn it on for one
# session, watch state/telemetry, and decide.
restore_reasoning = false

# OFF. Consent only: with SERVEDECK_GLM_CAPTURE=1 in the environment as well,
# the gateway keeps the last 6 turns of this route's request/response bodies
# under state/captures/<model>/ (mode 0700, credential headers redacted) for
# debugging a live failure. Bodies contain everything the user typed, which is
# why one flag lives here and the other cannot: the predecessor defaulted this
# to ON, writing full bodies to /tmp/glm-capture with no retention policy.
capture = false

# serve-opt.sh:324-352, at the script's own defaults (MAX_SEQS=1, MAX_BATCHED=8192,
# MOE_BACKEND=marlin, LOAD_FORMAT=auto, KV_DTYPE=auto, SPEC=1/SPEC_TOKENS=2, images
# off, AUTOTUNE=1 i.e. no flag, ENFORCE_EAGER=0 i.e. no flag, BLOCK_SIZE unset i.e.
# no flag, ATTN_BACKEND unset i.e. no flag).
# --kv-cache-memory-bytes is NOT a flag here: it is derived from ctx at render
# time via kv_cache_bytes_per_token below, because a pinned product and a
# movable ctx are two sources of truth for one number — and the page's context
# control moved only one of them.
flags = [
    "--tensor-parallel-size", "1",
    "--distributed-executor-backend", "mp",
    "--offload-backend", "uva",
    "--cpu-offload-gb", "125",
    "--cpu-offload-params", "experts",
    "--max-num-seqs", "1",
    "--max-num-batched-tokens", "8192",
    "--limit-mm-per-prompt", '{"image":0,"video":0}',
    "--kernel-config", '{"moe_backend":"marlin"}',
    "--load-format", "auto",
    "--kv-cache-dtype", "auto",
    "--enable-prefix-caching",
    "--speculative-config", '{"method":"mtp","num_speculative_tokens":2}',
    # As for flashnext: 125 GiB of pinned host memory has to be unregistered
    # inside the engine's own shutdown, and timeout 0 force-kills before it can.
    "--shutdown-timeout", "30",
]

[models.glm53.reasoning]
parser = "glm47"
mirror_content = true

[models.glm53.tools]
parser = "glm47"

[models.glm53.presets]
glm53-flash-low  = { reasoning_effort = "low" }
glm53-flash-high = { reasoning_effort = "high" }
glm53-flash-max  = {}

# serve-opt.sh:78-202, "the measured-best configuration".
[models.glm53.env]
CPU_OFFLOAD_GB = "125"
VLLM_MOE_HOT_SLOTS = "54"
VLLM_USE_BREAKABLE_CUDAGRAPH = "0"
VLLM_MOE_PREFILL_GROUPS = "1"
VLLM_MOE_HOT_PROFILE = "/home/pctablet505/Projects/vllm-glm53/hot-profile-125.json"
VLLM_WEIGHT_OFFLOADING_DISABLE_PIN_MEMORY = "1"
VLLM_USE_DEEP_GEMM = "0"
PYTORCH_ALLOC_CONF = "expandable_segments:True,pinned_use_cuda_host_register:True,pinned_num_register_threads:8"
TORCH_CUDA_ARCH_LIST = "12.0f"

# --------------------------------------------------------------------------------
# LFM2.5-350M — opt-in resident for mechanical, no-intelligence work (and the
# e2e gate). Owner directive 2026-09-16: by default servedeck runs one model;
# this resident is NOT started by default and nothing auto-adds it to
# desired.json — an operator turns it on explicitly (`servedeck start lfm2` /
# the "More models" card) when it is actually needed.
# --------------------------------------------------------------------------------
[models.lfm2]
id       = "LFM2.5-350M"
repo     = "LiquidAI/LFM2.5-350M"
slot     = "resident"
vram_mib = 4895                    # util floor2(4895/97887) = 0.05: owner 2026-09-27 "assign around 5gb gpu to
                                    # that model" (was 3300 = 0.03); 4894 would floor to 0.04
port     = 8007
build    = "stock"
ctx      = 32768                   # not native (128,000): lfm2-350m.service sizes this
                                    # resident's whole VRAM budget (vram_mib above) around
                                    # a 32768 KV cache, not the checkpoint's native ceiling
vision   = false
max_output_tokens = 4096
# No reasoning: LFM2.5 has no thinking mode, so there is no `reasoning` field to
# mirror into `reasoning_content` (lfm2-350m.service header comment).

# lfm2-350m.service ExecStart. NOTE: the live unit actually runs from
# vllm-qwen38next/.venv-next's python -m vllm.entrypoints.openai.api_server, not
# `<build>/bin/vllm serve` — build="stock" here is this packet's consolidation
# decision, not a transcription of the live unit. See the P1 report.
flags = [
    "--max-num-seqs", "64",
    "--dtype", "bfloat16",
]

[models.lfm2.tools]
parser = "lfm2"

# --- ThinkingCap-Qwen3.8-Flash-Next (bottlecapai), wired 2026-10-24. Both entries are opt-in: neither starts unless
# asked. Both run on the qwen38next build (the fork with the Qwen4Exp architecture) with PLE CPU offload, like flashnext.
#
# thinkingcap      : the unedited model (the normal one).
# thinkingcap-abl  : the same weights with the run-3 tmpl_L16 refusal-direction edit. UNCENSORED: it complies with
#                    requests the normal model refuses, including harmful ones. Not for automated pipelines.
#                    The edit = attention writers (ABL_PATCH weights) + runtime projections (ABL_RUNTIME, installed by
#                    abl_serve.ServeWorker at load). It must run eager: the projections are Python-level wrappers.
