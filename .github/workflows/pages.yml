# Publishes the documentation site to https://servedeck.rlalphalabs.com/ (GitHub Pages, source: GitHub Actions).
# The site tests gate the deploy: a broken link, a duplicate title or a banned claim stops it.
# A pull request runs the tests and the strict build, and never deploys.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-theme/**"
      - "mkdocs.yml"
      - "tests/test_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-theme/**"
      - "mkdocs.yml"
      - "tests/test_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . "mkdocs>=1.6" pytest
      - name: Test the site
        run: python -m pytest tests/test_site.py -q -rs -p no:cacheprovider
      - name: Build
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
