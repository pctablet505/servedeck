[project]
name = "coldstart-llm"
version = "0.1.0"
description = "A local web dashboard for a self-hosted LLM server: capacity planning, live metrics, restart supervision"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

keywords = ["llm", "vllm", "gpu", "kv-cache", "dashboard", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]

[project.scripts]
coldstart = "coldstart.__main__:main"

[project.urls]
Homepage = "https://github.com/pctablet505/coldstart"
Issues = "https://github.com/pctablet505/coldstart/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coldstart*"]

# The dashboard's static files live outside the package dir; ship them.
[tool.setuptools.package-data]
coldstart = ["../web/*", "../coldstart.toml.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
