[project]
name = "servedeck"
version = "0.1.0"
description = "A local web dashboard for a self-hosted LLM server: capacity planning, live metrics, restart supervision"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Servedeck contributors" }]
keywords = ["llm", "vllm", "gpu", "kv-cache", "dashboard", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
servedeck = "servedeck.__main__:main"

[project.urls]
Homepage = "https://github.com/pctablet505/servedeck"
Issues = "https://github.com/pctablet505/servedeck/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The dashboard's static files sit outside the package directory, so they are
# declared here rather than as package-data (which cannot reach "../").
packages = ["servedeck"]

[tool.setuptools.package-data]
servedeck = ["py.typed", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
