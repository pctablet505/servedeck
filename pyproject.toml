[project]
name = "servedeck"
version = "0.1.0"
description = "A systemd control plane, OpenAI-compatible /v1 gateway and live dashboard for native vLLM on one Linux GPU workstation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Servedeck contributors" }]
keywords = ["llm", "vllm", "gpu", "kv-cache", "dashboard", "self-hosted", "systemd", "openai-compatible", "llm-serving", "local-llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  # tomllib (stdlib, read-only) parses models.toml; tomli-w is the write side,
  # used by `servedeck wire --apply` to rewrite ~/.codex/config.toml and
  # ~/.kimi-code/config.toml (servedeck/wire.py).
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5", "mkdocs>=1.6"]
# The documentation site (mkdocs.yml, docs-theme/): `mkdocs build --strict`.
docs = ["mkdocs>=1.6"]

[project.scripts]
servedeck = "servedeck.cli:main"

[project.urls]
Homepage = "https://servedeck.rlalphalabs.com/"
Documentation = "https://servedeck.rlalphalabs.com/"
Source = "https://github.com/pctablet505/servedeck"
Issues = "https://github.com/pctablet505/servedeck/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["servedeck"]

[tool.setuptools.package-data]
servedeck = ["py.typed", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: boots a real model on the GPU; skipped unless the card has room",
]
